<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach Review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5d6470; --line: #e3e6eb;
    --accent: #2f5fe0; --accent-text: #ffffff; --good: #1f7a4a; --good-bg: #e6f4ec;
    --bad: #b3261e; --bad-bg: #fbe9e7; --warn: #8a5a00; --warn-bg: #fff4d6;
    --chip: #eef1f5; --sel: #eaf0ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #9aa2b1; --line: #262b35;
      --accent: #6d8dff; --accent-text: #0f1115; --good: #5fcf94; --good-bg: #13291e;
      --bad: #ff8a80; --bad-bg: #2d1614; --warn: #f2c35b; --warn-bg: #2b2412;
      --chip: #222733; --sel: #1d2638;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #9aa2b1; --line: #262b35;
    --accent: #6d8dff; --accent-text: #0f1115; --good: #5fcf94; --good-bg: #13291e;
    --bad: #ff8a80; --bad-bg: #2d1614; --warn: #f2c35b; --warn-bg: #2b2412;
    --chip: #222733; --sel: #1d2638;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { border: 0; background: transparent; color: var(--muted); padding: 6px 12px;
         border-radius: 8px; font: inherit; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--chip); color: var(--text); font-weight: 600; }
  .tab .n { font-variant-numeric: tabular-nums; margin-left: 4px; opacity: .8; }
  .hint { margin-left: auto; color: var(--muted); font-size: 13px; }
  kbd { font: 12px ui-monospace, monospace; background: var(--chip); border-radius: 4px;
        padding: 1px 5px; border: 1px solid var(--line); }
  main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; height: calc(100vh - 57px); }
  #list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
         background: transparent; color: inherit; font: inherit; padding: 12px 16px; cursor: pointer; }
  .row:hover { background: var(--bg); }
  .row[aria-current="true"] { background: var(--sel); }
  .row .name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .row .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden;
              text-overflow: ellipsis; }
  .badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  .b-high { background: var(--good-bg); color: var(--good); }
  .b-medium { background: var(--warn-bg); color: var(--warn); }
  .b-low, .b-skip { background: var(--bad-bg); color: var(--bad); }
  .b-none { background: var(--chip); color: var(--muted); }
  #detail { overflow-y: auto; padding: 24px 28px 48px; }
  .empty { color: var(--muted); padding: 48px 0; text-align: center; }
  .title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .title h2 { margin: 0; font-size: 22px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .meta a { color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr minmax(240px, 320px); gap: 24px; align-items: start; }
  .side { display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
             color: var(--muted); }
  ul.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.findings li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; font-size: 14px; }
  .ok { color: var(--good); font-weight: 700; } .no { color: var(--bad); font-weight: 700; }
  .wrong { color: var(--bad); }
  textarea { width: 100%; min-height: 300px; resize: vertical; border: 1px solid var(--line);
             border-radius: 10px; padding: 14px; font: 15px/1.6 -apple-system, BlinkMacSystemFont,
             "Segoe UI", Inter, sans-serif; background: var(--panel); color: var(--text); }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea[readonly] { background: var(--bg); }
  .count { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .alerts { display: grid; gap: 8px; margin-bottom: 12px; }
  .alert { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .alert.warn { background: var(--warn-bg); color: var(--warn); }
  .alert.block { background: var(--bad-bg); color: var(--bad); }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit;
         font-weight: 600; padding: 9px 16px; border-radius: 10px; cursor: pointer; text-decoration: none;
         display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .kv { font-size: 14px; display: grid; gap: 6px; }
  .kv b { font-weight: 600; }
  .kv span { color: var(--muted); word-break: break-all; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0;
           transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; height: auto; }
    #list { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #detail { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Outreach Review</h1>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <button class="btn" id="sync" type="button">Check Gmail for replies</button>
  <div class="hint"><kbd>A</kbd> approve <kbd>R</kbd> redraft <kbd>S</kbd> skip <kbd>J</kbd>/<kbd>K</kbd> move</div>
</header>
<main>
  <div id="list" aria-label="Drafts"></div>
  <section id="detail" aria-live="polite"></section>
</main>
<div id="toast" role="status"></div>
<script>
const TOKEN = "__REVIEW_TOKEN__";
const TABS = [["pending", "To review"], ["approved", "To send"], ["sent", "Sent"], ["replied", "Replied"],
              ["skipped", "Skipped"]];
const state = { groups: {}, tab: "pending", index: 0, busy: false };

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== false && value != null) node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child != null) node.append(child instanceof Node ? child : document.createTextNode(child));
  }
  return node;
}

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), Math.max(2600, text.length * 45));
}

async function api(path, body) {
  const response = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-Review-Token": TOKEN },
    body: JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function badge(confidence) {
  if (!confidence || confidence.score == null) return el("span", { class: "badge b-none" }, "unscored");
  return el("span", { class: `badge b-${confidence.label}` }, `${confidence.score} ${confidence.label}`);
}

function wordCount(message) {
  // The last paragraph is the auto-added signature; don't count it.
  const parts = message.trim().split(/\n\s*\n/);
  if (parts.length > 1 && /reply "stop"/i.test(parts[parts.length - 1])) parts.pop();
  return parts.join(" ").split(/\s+/).filter(Boolean).length;
}

function items() { return state.groups[state.tab] || []; }
function current() { return items()[state.index]; }

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.replaceChildren(...TABS.map(([key, label]) => el("button", {
    class: "tab", role: "tab", "aria-selected": String(state.tab === key),
    onclick: () => { state.tab = key; state.index = 0; render(); },
  }, label, el("span", { class: "n" }, String((state.groups[key] || []).length)))));
}

function renderList() {
  const list = document.getElementById("list");
  const rows = items().map((item, i) => el("button", {
    class: "row", "aria-current": String(i === state.index),
    onclick: () => { state.index = i; render(); },
  },
    el("div", { class: "name" }, el("span", {}, item.company), badge(item.confidence)),
    el("div", { class: "sub" }, item.kind === "followup" ? `Follow-up #${item.step}`
      : item.reply ? (item.reply.snippet || "Replied")
      : item.next_followup || item.confirmed[0] || item.send_to || item.channel),
  ));
  list.replaceChildren(...(rows.length ? rows : [el("div", { class: "empty" }, "Nothing here.")]));
  const selected = list.querySelector('[aria-current="true"]');
  if (selected) selected.scrollIntoView({ block: "nearest" });
}

function alertsFor(item, warnings) {
  const alerts = [];
  if (item.blocked) alerts.push(el("div", { class: "alert block" }, "Approval disabled: " + item.blocked));
  for (const w of warnings) alerts.push(el("div", { class: "alert warn" }, "Check before approving: " + w));
  return alerts;
}

function renderDetail() {
  const pane = document.getElementById("detail");
  const item = current();
  if (!item) {
    pane.replaceChildren(el("div", { class: "empty" },
      state.tab === "pending" ? "All caught up. Nothing left to review." : "Nothing in this list yet."));
    return;
  }
  const editable = item.status === "drafted";  // first notes and follow-ups alike
  // Warnings and approval blocks only matter while there is still a decision to make.
  const alertBox = el("div", { class: "alerts" }, editable ? alertsFor(item, item.warnings) : []);
  const count = el("p", { class: "count" });
  const text = el("textarea", { "aria-label": "Draft message", readonly: !editable });
  text.value = item.message;
  const updateCount = () => { count.textContent = `${wordCount(text.value)} words · hook: ${item.hook || "?"}`; };
  updateCount();
  let checkTimer;
  text.addEventListener("input", () => {
    updateCount();
    clearTimeout(checkTimer);
    checkTimer = setTimeout(async () => {
      try {
        const { warnings } = await api("/api/check",
          { company: item.company, contact_name: item.contact_name, message: text.value });
        alertBox.replaceChildren(...alertsFor(item, warnings));
      } catch (e) { /* keep the last warnings */ }
    }, 400);
  });

  function setButtons(disabled) {
    pane.querySelectorAll(".actions button").forEach(b => {
      b.disabled = disabled || (b.dataset.key === "a" && !!item.blocked)
        || (b.dataset.redraft === "1" && !item.can_redraft);
    });
  }
  const act = async (path, label, extra = {}) => {
    if (state.busy) return;
    state.busy = true; setButtons(true);
    if (path === "/api/redraft") toast("Redrafting... (can take up to a minute if rate-limited)");
    try {
      const data = await api(path, { company: item.company, contact_name: item.contact_name,
                                     message: text.value, hook: item.hook, step: item.step, ...extra });
      if (path === "/api/redraft") {
        text.value = data.message; item.message = data.message; item.hook = data.hook;
        item.warnings = data.warnings; updateCount();
        alertBox.replaceChildren(...alertsFor(item, data.warnings));
        toast(data.warnings.length ? "Redrafted - check the warning" : "Redrafted");
      } else {
        toast(label);
        await load();
      }
    } catch (error) { toast(error.message); }
    finally { state.busy = false; setButtons(false); }
  };

  const isFollowup = item.kind === "followup";
  const route = (action) => (isFollowup ? `/api/followup/${action}` : `/api/${action}`);
  const buttons = [];
  if (isFollowup && item.status === "drafted") {
    buttons.push(
      el("button", { class: "btn primary", "data-key": "a",
                     onclick: () => act(route("approve"), `Approved follow-up #${item.step} for ${item.company}`) }, "Approve"),
      el("button", { class: "btn", "data-key": "s",
                     onclick: () => act(route("skip"), `Skipped follow-up for ${item.company}`) }, "Skip"),
    );
  } else if (editable) {
    buttons.push(
      el("button", { class: "btn primary", disabled: !!item.blocked, "data-key": "a",
                     onclick: () => act("/api/approve", `Approved ${item.company}`) }, "Approve"),
      el("button", { class: "btn", disabled: !item.can_redraft, "data-key": "r", "data-redraft": "1",
                     onclick: () => act("/api/redraft", "", { hook: item.hook }) }, "Redraft"),
      el("button", { class: "btn", disabled: !item.can_redraft, "data-redraft": "1",
                     onclick: () => act("/api/redraft", "", { hook: "next" }) }, "Try another angle"),
      el("button", { class: "btn", "data-key": "s",
                     onclick: () => act("/api/skip", `Skipped ${item.company}`) }, "Skip"),
    );
  } else if (state.tab === "approved") {
    if (item.send_url) {
      buttons.push(el("a", { class: "btn primary", href: item.send_url, target: "_blank", rel: "noopener" },
        item.channel === "email" ? "Open in Gmail" : "Open contact page"));
    }
    buttons.push(
      el("button", { class: "btn", onclick: async () => {
        try { await navigator.clipboard.writeText(item.message); toast("Message copied"); }
        catch (e) { toast("Copy failed; select the text and copy it"); }
      } }, "Copy message"),
      el("button", { class: "btn", onclick: () => {
        if (confirm(`Record that you sent the message to ${item.company}?`)) {
          act(route("sent"), `Logged send to ${item.company}`);
        }
      } }, "I sent it"),
      el("button", { class: "btn", onclick: () => {
        if (confirm(`Skip ${item.company}? It won't be sent.`)) act(route("skip"), `Skipped ${item.company}`);
      } }, "Don't send"),
    );
  } else if (state.tab === "sent") {
    buttons.push(el("button", { class: "btn primary", onclick: () => {
      if (confirm(`Mark ${item.company} as replied? Their remaining follow-ups will be cancelled.`)) {
        act("/api/replied", `Marked ${item.company} as replied`);
      }
    } }, "They replied"));
  }

  const found = el("ul", { class: "findings" },
    item.confirmed.map(f => el("li", {}, el("span", { class: "ok" }, item.browser_checked ? "✓" : "?"), f)),
    item.disproven.map(f => el("li", { class: "wrong" }, el("span", { class: "no" }, "✗"),
      "Their site HAS this: " + f)),
  );
  pane.replaceChildren(...[
    el("div", { class: "title" }, el("h2", {}, item.company), badge(item.confidence),
      item.kind === "followup" ? el("span", { class: "badge b-none" }, `Follow-up #${item.step}`) : null),
    item.next_followup ? el("p", { class: "count" }, "Next: " + item.next_followup) : null,
    item.reply ? el("div", { class: "alert warn", style: "margin-bottom:12px" },
      `Replied${item.reply.source === "gmail" ? " (from Gmail)" : ""}: ${item.reply.snippet || "reply recorded"} - answer them from Gmail.`) : null,
    item.subject ? el("p", { class: "count" }, "Subject: " + item.subject) : null,
    el("div", { class: "meta" },
      item.website ? el("a", { href: item.website, target: "_blank", rel: "noopener" },
        item.website.replace(/^https?:\/\//, "") + " ↗") : "",
      item.category ? ` · ${item.category.replace("_", " ")}` : ""),
    el("div", { class: "grid" },
      el("div", {}, alertBox, text, count, el("div", { class: "actions" }, buttons)),
      el("div", { class: "side" },
        el("div", { class: "card" }, el("h3", {}, "What the site check found"),
          item.confirmed.length || item.disproven.length ? found
            : el("p", { class: "count" }, "No findings recorded.")),
        el("div", { class: "card" }, el("h3", {}, "Details"),
          el("div", { class: "kv" },
            el("div", {}, el("b", {}, "Send to "), el("span", {}, item.send_to || "-")),
            el("div", {}, el("b", {}, "Channel "), el("span", {}, item.channel || "-")),
            el("div", {}, el("b", {}, "Why this score "),
              el("span", {}, (item.confidence.reasons || []).join("; ") || "-")),
          ))),
    ),
  ].filter(Boolean));  // optional status lines are null when absent
}

function render() {
  const n = items().length;
  if (state.index >= n) state.index = Math.max(0, n - 1);
  renderTabs(); renderList(); renderDetail();
}

async function load() {
  try { state.groups = await api("/api/items"); render(); }
  catch (error) { toast("Could not load drafts: " + error.message); }
}

document.addEventListener("keydown", (event) => {
  if (event.target.tagName === "TEXTAREA" || event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (key === "j" || key === "arrowdown") {
    event.preventDefault(); state.index = Math.min(state.index + 1, items().length - 1); render();
  } else if (key === "k" || key === "arrowup") {
    event.preventDefault(); state.index = Math.max(state.index - 1, 0); render();
  } else {
    const button = document.querySelector(`.actions [data-key="${key}"]`);
    if (button && !button.disabled) { event.preventDefault(); button.click(); }
  }
});

document.getElementById("sync").addEventListener("click", async (event) => {
  const button = event.currentTarget;
  button.disabled = true; toast("Checking Gmail for replies...");
  try {
    const { found } = await api("/api/sync-replies", {});
    toast(found.length ? `New replies: ${found.join(", ")}` : "No new replies");
    await load();
  } catch (error) { toast(error.message); }
  finally { button.disabled = false; }
});

load();
</script>
</body>
</html>
